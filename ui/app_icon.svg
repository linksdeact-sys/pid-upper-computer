<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#007AFF"/>
      <stop offset="100%" stop-color="#0055D4"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#B3D9FF"/>
    </linearGradient>
  </defs>
  <!-- 圆角矩形背景 -->
  <rect x="4" y="4" width="120" height="120" rx="28" ry="28" fill="url(#bg)"/>
  <!-- 网格线 -->
  <line x1="28" y1="38" x2="28" y2="98" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <line x1="50" y1="38" x2="50" y2="98" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <line x1="72" y1="38" x2="72" y2="98" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <line x1="94" y1="38" x2="94" y2="98" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <line x1="22" y1="50" x2="106" y2="50" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <line x1="22" y1="68" x2="106" y2="68" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <line x1="22" y1="86" x2="106" y2="86" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <!-- PID响应曲线 -->
  <polyline points="22,86 35,84 45,78 52,55 58,42 64,48 72,62 78,68 84,66 92,64 100,63 106,63"
    stroke="url(#line)" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 目标线 -->
  <line x1="22" y1="63" x2="106" y2="63" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-dasharray="6,4"/>
  <!-- PID文字 -->
  <text x="64" y="26" text-anchor="middle" fill="white" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="bold">PID</text>
</svg>
